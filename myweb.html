<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Navbar</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <style>
            *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:200vh;
    background:#f5f7fb;
}

header{
    position:sticky;
    top:0;
    width:100%;
    background:#fff;
    box-shadow:0 2px 20px rgba(0,0,0,.08);
    z-index:999;
}

.navbar{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo a{
    font-size:28px;
    font-weight:700;
    color:#111827;
    text-decoration:none;
}

.logo span{
    color:#2563eb;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:35px;
}

.nav-links a{
    text-decoration:none;
    color:#374151;
    font-weight:500;
    transition:.3s;
    position:relative;
}

.nav-links a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-6px;
    width:0%;
    height:2px;
    background:#2563eb;
    transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
    color:#2563eb;
}

.nav-links a:hover::after,
.nav-links a.active::after{
    width:100%;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.btn{
    padding:12px 24px;
    background:#2563eb;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.menu-btn{
    display:none;
    font-size:26px;
    cursor:pointer;
    color:#111827;
}

@media(max-width:900px){

.nav-links{
    position:absolute;
    top:78px;
    left:-100%;
    width:100%;
    background:#fff;
    flex-direction:column;
    text-align:center;
    padding:25px 0;
    gap:25px;
    transition:.4s;
    box-shadow:0 15px 20px rgba(0,0,0,.08);
}

.nav-links.active{
    left:0;
}

.menu-btn{
    display:block;
}

.btn{
    display:none;
}

}
        </style>
</head>
<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <a href="#">Brand<span>.</span></a>
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="nav-right">
            <a href="#" class="btn">Get Started</a>

            <div class="menu-btn" id="menuBtn">
                <i class="fas fa-bars"></i>
            </div>
        </div>

    </nav>
</header>

<script>
    const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

menuBtn.addEventListener("click", () => {
    navLinks.classList.toggle("active");

    menuBtn.innerHTML = navLinks.classList.contains("active")
        ? '<i class="fas fa-times"></i>'
        : '<i class="fas fa-bars"></i>';
});
</script>

</body>
</html>
