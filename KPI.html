<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4F46E5,#7C3AED);
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:380px;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

.login-box p{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:14px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    border-color:#4F46E5;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#4F46E5;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#4F46E5;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4338CA;
}

.signup{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.signup a{
    color:#4F46E5;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:480px){
    .login-box{
        width:90%;
        padding:30px;
    }
}
</style>>
<body>

<div class="container">
    <div class="login-box">
        <h2>Uttrakhand All Private University Registation</h2>
        <p>Sign in to your account</p>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="KPI2.html">Forgot Password?</a>
            </div>

            <a href="KPI2.html"><button type="submit">Login</button></a>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
